name: MCP Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install project and test dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Build release artifacts
        run: uv build
      - name: Run MCP Audit action smoke test
        uses: ./
        with:
          path: fixtures/safe_server
          baseline: HEAD
          job-summary: "false"

  security-diff:
    name: Security regression check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: robbyfa/MCP-Audit@v0.2.0
        with:
          path: examples/vulnerable-fastmcp
          baseline: origin/main
