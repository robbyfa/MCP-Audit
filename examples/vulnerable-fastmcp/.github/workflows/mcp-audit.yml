name: MCP Audit

on:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: robbyfa/MCP-Audit@v0.2.3
        with:
          path: .
          baseline: ${{ github.event.pull_request.base.sha }}
          policy: mcp-audit.yaml
