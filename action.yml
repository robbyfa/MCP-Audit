name: MCP Audit
description: Scan a Python/FastMCP server for security capability regressions and upload SARIF.
inputs:
  path:
    description: Path to the MCP server source.
    required: false
    default: "."
  baseline:
    description: Git revision used as the approved security baseline.
    required: false
    default: "origin/main"
  target:
    description: Deprecated alias for path.
    required: false
    default: ""
  base:
    description: Deprecated alias for baseline.
    required: false
    default: ""
  policy:
    description: Optional MCP Audit policy file.
    required: false
    default: ""
  sarif:
    description: SARIF output path.
    required: false
    default: "mcp-audit.sarif"
  summary:
    description: Markdown job-summary output path.
    required: false
    default: "mcp-audit-summary.md"
  job-summary:
    description: Append the Markdown report to the GitHub Actions job summary.
    required: false
    default: "true"
outputs:
  exit-code:
    description: MCP Audit exit code (0 pass, 1 security regression, 2 operational error).
    value: ${{ steps.audit.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Install MCP Audit
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Generate security diff
      id: audit
      shell: bash
      env:
        MCP_AUDIT_PATH: ${{ inputs.target || inputs.path }}
        MCP_AUDIT_BASELINE: ${{ inputs.base || inputs.baseline }}
        MCP_AUDIT_POLICY: ${{ inputs.policy }}
        MCP_AUDIT_SARIF: ${{ inputs.sarif }}
        MCP_AUDIT_SUMMARY: ${{ inputs.summary }}
      run: |
        set +e
        args=(diff --baseline "$MCP_AUDIT_BASELINE" "$MCP_AUDIT_PATH" --sarif-output "$MCP_AUDIT_SARIF" --summary-output "$MCP_AUDIT_SUMMARY")
        if [[ -n "$MCP_AUDIT_POLICY" ]]; then
          args+=(--policy "$MCP_AUDIT_POLICY")
        fi
        mcp-audit "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [[ $code -eq 2 ]]; then
          exit 2
        fi
        exit 0
    - name: Add security diff summary
      if: always() && inputs.job-summary == 'true' && steps.audit.outputs.exit-code != '2'
      shell: bash
      env:
        MCP_AUDIT_SUMMARY: ${{ inputs.summary }}
      run: cat "$MCP_AUDIT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif }}
    - name: Enforce policy result
      if: steps.audit.outputs.exit-code == '1'
      shell: bash
      run: exit 1
