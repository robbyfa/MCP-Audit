[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-capdiff"
dynamic = ["version"]
description = "Security regression scanner for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "MCP Audit contributors" }]
dependencies = [
  "PyYAML>=6.0,<7",
]
keywords = ["mcp", "security", "static-analysis", "sarif", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/robbyfa/MCP-Audit"
Repository = "https://github.com/robbyfa/MCP-Audit"
Issues = "https://github.com/robbyfa/MCP-Audit/issues"

[project.scripts]
mcp-audit = "mcp_audit.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mcp_audit.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
